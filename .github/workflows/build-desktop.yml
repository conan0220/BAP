name: Build Windows Desktop Prototype

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bap_desktop/**"
      - "bap_common/**"
      - "anrot_imu_driver/**"
      - "packaging/windows/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked Desktop build dependencies
        shell: pwsh
        run: uv sync --frozen --extra desktop --extra packaging
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Desktop installer
        shell: pwsh
        run: .\packaging\windows\Build-BapDesktop.ps1
      - name: Test install, launch, and uninstall
        shell: pwsh
        run: .\packaging\windows\Smoke-Test-BapInstaller.ps1 -InstallerPath .\dist\BAP-Setup-0.1.0.exe
      - name: Upload unsigned Prototype installer
        uses: actions/upload-artifact@v4
        with:
          name: BAP-Windows-Prototype
          path: dist/BAP-Setup-*.exe

